function SpiritualGiftsApp() {
  const [step, setStep] = useState('welcome');
  const [userName, setUserName] = useState('');
  const [userEmail, setUserEmail] = useState('');
  const [inventoryPage, setInventoryPage] = useState(0);
  const [answers, setAnswers] = useState(Array(QUESTIONS.length).fill(null));
  const [callingAnswers, setCallingAnswers] = useState(EMPTY_CALLING);
  const [submitState, setSubmitState] = useState('idle'); // idle | submitting | submitted | error
  const [submitError, setSubmitError] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [hasSavedData, setHasSavedData] = useState(false);
  const [savedAt, setSavedAt] = useState(null);
  const [saveState, setSaveState] = useState('idle');
  const [showUnansweredWarning, setShowUnansweredWarning] = useState(false);
  const topRef = useRef(null);

  // --- Load saved progress (browser localStorage)
  useEffect(() => {
    try {
      const raw = typeof window !== 'undefined' ? window.localStorage.getItem('bayside-sga-progress') : null;
      if (raw) {
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.answers)) {
          setHasSavedData(true);
          setSavedAt(data.savedAt);
        }
      }
    } catch (e) { /* none */ }
    setLoaded(true);
  }, []);

  // --- Auto-save (browser localStorage)
  useEffect(() => {
    if (!loaded || step === 'welcome') return;
    const id = setTimeout(() => {
      try {
        if (typeof window === 'undefined') return;
        setSaveState('saving');
        window.localStorage.setItem('bayside-sga-progress', JSON.stringify({
          step, userName, userEmail, inventoryPage, answers, callingAnswers, submitState,
          savedAt: new Date().toISOString(),
        }));
        setSaveState('saved');
        setTimeout(() => setSaveState('idle'), 1400);
      } catch (e) { setSaveState('idle'); }
    }, 500);
    return () => clearTimeout(id);
  }, [step, userName, userEmail, inventoryPage, answers, callingAnswers, submitState, loaded]);

  // --- Computed scores
  const scores = useMemo(() => GIFTS.map((g, i) => {
    const slice = answers.slice(i * 5, i * 5 + 5);
    const total = slice.reduce((s, v) => s + (v ?? 0), 0);
    return { ...g, score: total };
  }), [answers]);

  const sortedScores = useMemo(
    () => [...scores].sort((a, b) => b.score - a.score),
    [scores]
  );
  const topThree = sortedScores.slice(0, 3);
  const thirdScore = topThree[2]?.score ?? 0;
  const secondary = sortedScores.filter(s => s.score >= 10 && !topThree.find(t => t.id === s.id));

  const totalAnswered = answers.filter(a => a !== null).length;
  const pageAnswered = answers
    .slice(inventoryPage * QUESTIONS_PER_PAGE, (inventoryPage + 1) * QUESTIONS_PER_PAGE)
    .filter(a => a !== null).length;
  const allAnswered = totalAnswered === QUESTIONS.length;

  function scrollTop() {
    if (topRef.current) topRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
    else window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function handleResume() {
    try {
      const raw = window.localStorage.getItem('bayside-sga-progress');
      if (raw) {
        const data = JSON.parse(raw);
        setStep(data.step || 'inventory');
        setUserName(data.userName || '');
        setUserEmail(data.userEmail || '');
        setInventoryPage(data.inventoryPage || 0);
        setAnswers(data.answers || Array(QUESTIONS.length).fill(null));
        setCallingAnswers({ ...EMPTY_CALLING, ...(data.callingAnswers || {}) });
        setSubmitState(data.submitState || 'idle');
      }
    } catch (e) { setStep('name'); }
    setTimeout(scrollTop, 50);
  }

  function handleStartFresh() {
    try { window.localStorage.removeItem('bayside-sga-progress'); } catch (e) {}
    setUserName('');
    setUserEmail('');
    setInventoryPage(0);
    setAnswers(Array(QUESTIONS.length).fill(null));
    setCallingAnswers(EMPTY_CALLING);
    setSubmitState('idle');
    setSubmitError(null);
    setHasSavedData(false);
    setStep('name');
    setTimeout(scrollTop, 50);
  }

  function setAnswer(idx, val) {
    setAnswers(prev => {
      const next = [...prev];
      next[idx] = val;
      return next;
    });
  }

  async function submitAssessment() {
    setSubmitState('submitting');
    setSubmitError(null);
    const isConfigured = !SUPABASE_URL.includes('PASTE') && !SUPABASE_ANON_KEY.includes('PASTE');

    try {
      // Compute payload
      const scoresMap = {};
      scores.forEach(s => { scoresMap[s.id] = s.score; });
      const topThreeData = topThree.map(g => ({ id: g.id, name: g.name, score: g.score }));

      if (!isConfigured) {
        // Demo mode - skip network calls, mark as submitted
        await new Promise(r => setTimeout(r, 800));
        setSubmitState('submitted');
        setStep('results');
        setTimeout(scrollTop, 50);
        return;
      }

      // 1. Insert into Supabase
      const { error: dbError } = await supabase.from('assessments').insert({
        name: userName,
        email: userEmail,
        scores: scoresMap,
        top_three: topThreeData,
        calling_answers: callingAnswers,
      });
      if (dbError) throw new Error(`Database: ${dbError.message}`);

      // 2. Send emails (best-effort, do not block results)
      const topThreeText = topThreeData.map((g, i) => `${i + 1}. ${g.name} (${g.score}/20)`).join('\n');
      const callingText = CALLING_QUESTIONS.map(q => `${q.title.toUpperCase()}\n${callingAnswers[q.key] || '(no response)'}`).join('\n\n');
      const emailConfigured = !EMAILJS_SERVICE_ID.includes('PASTE') && !EMAILJS_PUBLIC_KEY.includes('PASTE');

      if (emailConfigured) {
        const pastorPayload = {
          to_email: PASTOR_EMAIL,
          member_name: userName,
          member_email: userEmail,
          top_three: topThreeText,
          calling_profile: callingText,
          date: new Date().toLocaleString(),
        };
        const userPayload = {
          to_email: userEmail,
          to_name: userName.split(' ')[0] || userName,
          top_three: topThreeText,
        };
        if (!EMAILJS_TEMPLATE_PASTOR.includes('PASTE')) {
          try { await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_PASTOR, pastorPayload); }
          catch (e) { console.error('Pastor email failed:', e); }
        }
        if (!EMAILJS_TEMPLATE_USER.includes('PASTE')) {
          try { await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_USER, userPayload); }
          catch (e) { console.error('User email failed:', e); }
        }
      }

      setSubmitState('submitted');
      setStep('results');
      setTimeout(scrollTop, 50);
    } catch (e) {
      console.error('Submission error:', e);
      setSubmitError(e.message || 'Submission failed');
      setSubmitState('error');
    }

function InventoryScreen({

  totalAnswered, pageAnswered, showUnansweredWarning,

  const startIdx = page * QUESTIONS_PER_PAGE;
  const endIdx = Math.min(startIdx + QUESTIONS_PER_PAGE, QUESTIONS.length);
  const pageQuestions = [];
  for (let i = startIdx; i < endIdx; i++) {
    pageQuestions.push({ idx: i, text: QUESTIONS[i] });
  }
  const overallPct = (totalAnswered / QUESTIONS.length) * 100;
  const isLastPage = page === TOTAL_PAGES - 1;

  return (
    <div className="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-10">

          </div>
          <span className="tabular-nums whitespace-nowrap">{totalAnswered} / {QUESTIONS.length}</span>
        </div>
      </div>

      <div className="bs-card p-4 mb-6">
        <div className="uppercase-wide text-[10px] text-[var(--ink-muted)] font-semibold mb-2">Scale</div>
        <div className="grid grid-cols-5 gap-1.5 sm:gap-2 text-[11px] sm:text-xs text-[var(--ink-soft)]">

            <div key={s.value} className="text-center">
              <div className="font-display text-xl text-[var(--bayside-blue)] leading-none mb-1">{s.value}</div>

                  const active = value === s.value;

                    <button
                      key={s.value}

                })}

        })}

                {QUESTIONS.length - totalAnswered} unanswered question{QUESTIONS.length - totalAnswered === 1 ? '' : 's'}
              </p>
              <p className="text-sm text-[var(--ink-soft)]">
                For the most accurate results, we recommend answering all 90 statements first.
              </p>
            </div>
          </div>
          <div className="flex flex-wrap gap-2">
            <button onClick={onJumpToUnanswered} className="bs-btn-primary text-xs px-4 py-2 rounded-md">
              Jump to First
            </button>
            <button onClick={onContinueAnyway} className="bs-btn-secondary text-xs px-4 py-2 rounded-md">
              Continue Anyway
            </button>
            <button onClick={onDismissWarning} className="bs-btn-ghost text-xs px-4 py-2">
              Cancel
            </button>
          </div>
        </div>
      )}

      {/* Nav */}
      <div className="flex items-center justify-between gap-3">
        <button onClick={onPrev} className="bs-btn-ghost inline-flex items-center gap-1.5 px-4 py-3 text-sm font-semibold uppercase-tight">
          <ChevronLeft className="w-4 h-4" /> Back
        </button>
        <div className="text-xs text-[var(--ink-muted)] hidden sm:block tabular-nums font-medium">
          {pageAnswered} / {pageQuestions.length} on this page
        </div>
        <button onClick={onNext} className="bs-btn-primary inline-flex items-center gap-1.5 px-5 sm:px-7 py-3 rounded-lg text-sm">
          {isLastPage ? 'Continue to Part II' : 'Next Section'}
          <ChevronRight className="w-4 h-4" />
        </button>
      </div>
    </div>
  );
}

function CallingScreen({ callingAnswers, setCallingAnswers, submitState, submitError, onBack, onSubmit, onSkip }) {
  function update(key, val) {
    setCallingAnswers(prev => ({ ...prev, [key]: val }));
  }
  const submitting = submitState === 'submitting';
  const errored = submitState === 'error';
  return (
    <div className="max-w-2xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
      <div className="mb-6"><BrandHeader /></div>

      <div className="mb-8 bs-fade-up">
        <div className="uppercase-wide text-[11px] text-[var(--bayside-blue)] font-semibold mb-3">
          Part II · Calling Profile
        </div>
        <h2 className="font-display text-3xl sm:text-5xl leading-[0.95] mb-4">
          BEYOND YOUR <span className="text-[var(--bayside-blue)]">GIFTS.</span>
        </h2>
        <p className="text-[var(--ink-soft)] leading-relaxed">
          Your spiritual gifts are only part of the picture. God also uses your passions, burdens,
          and life experiences to shape your calling. Answer prayerfully and honestly.
        </p>
      </div>

      <div className="space-y-4 mb-8">
        {CALLING_QUESTIONS.map((q, i) => {
          const Icon = q.icon;
          const useCyan = i % 2 === 1;
          return (
            <div key={q.key} className="bs-card p-5 sm:p-6 bs-fade-up">
              <div className="flex items-center gap-3 mb-3">
                <div
                  className="w-10 h-10 rounded-full flex items-center justify-center shrink-0"
                  style={{ background: useCyan ? 'var(--bayside-cyan-soft)' : 'rgba(2,112,222,0.1)' }}
                >
                  <Icon className="w-4 h-4" style={{ color: useCyan ? 'var(--bayside-blue-dark)' : 'var(--bayside-blue)' }} />
                </div>
                <h3 className="font-display text-2xl uppercase-tight">{q.title}</h3>
              </div>
              <p className="text-[var(--ink)] mb-2 leading-relaxed">{q.prompt}</p>
              {q.hint && <p className="text-xs italic text-[var(--ink-muted)] mb-3">{q.hint}</p>}
              <textarea
                value={callingAnswers[q.key]}
                onChange={(e) => update(q.key, e.target.value)}
                rows={4}
                placeholder="Your reflection…"
                className="bs-textarea w-full rounded-lg px-4 py-3 text-[var(--ink)] resize-y leading-relaxed"
              />
            </div>
          );
        })}
      </div>

      {errored && (
        <div className="mb-5 bs-card p-5 border-l-[4px] border-[var(--bayside-orange)] bs-fade-up">
          <div className="flex items-start gap-3 mb-3">
            <AlertCircle className="w-5 h-5 text-[var(--bayside-orange)] shrink-0 mt-0.5" />
            <div>
              <p className="font-bold mb-1">We couldn’t save your results.</p>
              <p className="text-sm text-[var(--ink-soft)]">
                {submitError || 'There was a problem connecting to the server.'} Check your internet
                connection and try again. If the issue continues, you can view your results without
                submitting.
              </p>
            </div>
          </div>
          <div className="flex flex-wrap gap-2">
            <button onClick={onSubmit} className="bs-btn-primary text-xs px-4 py-2 rounded-md">Try Again</button>
            <button onClick={onSkip} className="bs-btn-secondary text-xs px-4 py-2 rounded-md">View Results Without Saving</button>
          </div>
        </div>
      )}

      <div className="flex items-center justify-between gap-3">
        <button
          onClick={onBack}
          disabled={submitting}
          className="bs-btn-ghost inline-flex items-center gap-1.5 px-4 py-3 text-sm font-semibold uppercase-tight disabled:opacity-40"
        >
          <ChevronLeft className="w-4 h-4" /> Inventory
        </button>
        <button
          onClick={onSubmit}
          disabled={submitting}
          className="bs-btn-primary inline-flex items-center gap-1.5 px-5 sm:px-7 py-3 rounded-lg text-sm disabled:opacity-70"
        >
          {submitting ? (
            <>
              <Loader2 className="w-4 h-4 animate-spin" /> Submitting…
            </>
          ) : (
            <>
              <Send className="w-4 h-4" /> Submit & See My Results
            </>
          )}
        </button>
      </div>
    </div>
  );
}

function ResultsScreen({
  userName, userEmail, scores, sortedScores, topThree, thirdScore, secondary,
  callingAnswers, submitState, onRestart, onEditInventory, onEditCalling,
}) {
  const wasSubmitted = submitState === 'submitted';
  const chartData = sortedScores.map((s, idx) => {
    const isTop = idx < 3;
    const isSecondary = !isTop && s.score >= 10;
    return {
      name: s.name,
      score: s.score,
      tier: isTop ? 'top' : isSecondary ? 'secondary' : 'low',
    };
  });

  function downloadResults() {
    const lines = [];
    lines.push('BAYSIDE CHAPEL — SPIRITUAL GIFTS & CALLING ASSESSMENT');
    lines.push('================================================');
    lines.push('');
    if (userName) lines.push(`Name: ${userName}`);
    lines.push(`Date: ${new Date().toLocaleDateString()}`);
    lines.push('');
    lines.push('—— TOP THREE GIFTS ——');
    topThree.forEach((g, i) => {
      lines.push(`${i + 1}. ${g.name} (${g.score}/20)`);
      lines.push(`   ${g.desc}`);
      lines.push(`   Scripture: ${g.scripture}`);
      lines.push('');
    });
    lines.push('—— ALL GIFT SCORES ——');
    sortedScores.forEach(g => lines.push(`${g.name.padEnd(28)} ${g.score}/20`));
    lines.push('');
    lines.push('—— CALLING PROFILE ——');
    CALLING_QUESTIONS.forEach(q => {
      lines.push(q.title.toUpperCase());
      lines.push(callingAnswers[q.key] || '(no response)');
      lines.push('');
    });
    lines.push('');
    lines.push('Bayside Chapel · baysidechapel.org');
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `bayside-gifts-${(userName || 'assessment').replace(/\s+/g, '-').toLowerCase()}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function emailResults() {
    const body = encodeURIComponent(
      `Hi,\n\nHere are my Spiritual Gifts & Calling results from Bayside Chapel.\n\n` +
      (userName ? `Name: ${userName}\n` : '') +
      `Date: ${new Date().toLocaleDateString()}\n\n` +
      `TOP THREE GIFTS:\n${topThree.map((g, i) => `${i + 1}. ${g.name} (${g.score}/20)`).join('\n')}\n\n` +
      `I'd love to talk about how I can begin using these gifts to serve.\n\n` +
      `Thanks,\n${userName || ''}`
    );
    window.location.href = `mailto:?subject=${encodeURIComponent('My Spiritual Gifts Results')}&body=${body}`;
  }

  const tierColor = (tier) =>
    tier === 'top' ? '#0270DE' :
    tier === 'secondary' ? '#48D8DB' :
    '#CBD5E1';

  return (
    <div>
      {/* Dark hero */}
      <div className="bs-hero-spotlight text-white px-5 sm:px-8 pt-8 pb-16 sm:pt-10 sm:pb-20">
        <div className="max-w-4xl mx-auto">
          <BrandHeader dark />
        </div>
        <div className="max-w-4xl mx-auto mt-10 sm:mt-16 bs-fade-up">
          <div className="uppercase-wide text-[11px] text-[var(--bayside-cyan)] font-semibold mb-4">
            Part III · Your Results
          </div>
          <h1 className="font-display text-5xl sm:text-7xl md:text-8xl leading-[0.92] mb-3">
            {userName ? `${userName.split(' ')[0].toUpperCase()},` : 'YOUR'}<br/>
            YOUR <span className="text-[var(--bayside-cyan)]">GIFTS.</span>
          </h1>
          <p className="font-serif italic text-lg sm:text-xl text-white/75 max-w-xl mt-4">
            These results are the start of a conversation — with the Holy Spirit, your church
            community, and the people God has placed around you.
          </p>
        </div>
      </div>

      <div className="max-w-4xl mx-auto px-4 sm:px-6 py-10 sm:py-14">
        {wasSubmitted && (
          <div className="mb-8 -mt-24 sm:-mt-28 relative bs-card p-5 sm:p-6 border-l-[4px] border-[var(--bayside-blue)] bs-fade-up no-print">
            <div className="flex items-start gap-3">
              <div className="w-10 h-10 rounded-full bg-[var(--bayside-cyan-soft)] flex items-center justify-center shrink-0">
                <Check className="w-5 h-5 text-[var(--bayside-blue-dark)]" />
              </div>
              <div>
                <p className="font-bold uppercase-tight text-sm mb-1">Results saved</p>
                <p className="text-sm text-[var(--ink-soft)] leading-relaxed">
                  We've shared your results with the Bayside pastoral team{userEmail ? ` and sent a copy to ${userEmail}` : ''}.
                  Take some time to prayerfully consider how God might be inviting you to use these gifts.
                </p>
              </div>
            </div>
          </div>
        )}

        {/* Top Three */}
        <div className={`mb-12 ${wasSubmitted ? '' : '-mt-24 sm:-mt-28'} relative`}>
          <div className="grid sm:grid-cols-3 gap-4 mb-6">
            {topThree.map((g, i) => (
              <TopGiftCard key={g.id} gift={g} rank={i} delay={i * 80} />
            ))}
          </div>
          <p className="text-xs text-[var(--ink-muted)] italic text-center">
            Scores of 15–20 indicate your strongest gifts. 10–14 suggest secondary gifts worth exploring.
          </p>
        </div>

        {/* Chart */}
        <div className="mb-12 bs-card p-5 sm:p-7">
          <div className="flex items-end justify-between mb-1 flex-wrap gap-2">
            <h2 className="font-display text-2xl sm:text-3xl uppercase-tight">
              YOUR COMPLETE <span className="text-[var(--bayside-blue)]">PROFILE</span>
            </h2>
            <div className="text-xs uppercase-wide text-[var(--ink-muted)] font-semibold">
              18 Gifts · Ranked
            </div>
          </div>
          <p className="text-sm text-[var(--ink-muted)] mb-6">All 18 spiritual gifts, scored 0–20.</p>
          <div style={{ height: Math.max(420, GIFTS.length * 28) }}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart
                data={chartData}
                layout="vertical"
                margin={{ top: 5, right: 40, left: 0, bottom: 5 }}
              >
                <XAxis
                  type="number"
                  domain={[0, 20]}
                  ticks={[0, 5, 10, 15, 20]}
                  axisLine={false}
                  tickLine={false}
                  tick={{ fontSize: 11, fill: '#6B7280' }}
                />
                <YAxis
                  type="category"
                  dataKey="name"
                  width={130}
                  axisLine={false}
                  tickLine={false}
                  tick={{ fontSize: 12, fill: '#0A0A0A' }}
                />
                <Tooltip
                  contentStyle={{
                    backgroundColor: '#0A0A0A',
                    border: 'none',
                    borderRadius: '8px',
                    fontFamily: 'Poppins, sans-serif',
                    fontSize: '13px',
                    color: '#fff',
                  }}
                  labelStyle={{ color: '#48D8DB', fontWeight: 700, textTransform: 'uppercase', fontSize: '11px', letterSpacing: '0.05em' }}
                  itemStyle={{ color: '#fff' }}
                  formatter={(v) => [`${v} / 20`, 'Score']}
                  cursor={{ fill: 'rgba(2,112,222,0.08)' }}
                />
                <Bar dataKey="score" radius={[0, 6, 6, 0]}>
                  {chartData.map((entry, idx) => (
                    <Cell key={`cell-${idx}`} fill={tierColor(entry.tier)} />
                  ))}
                  <LabelList
                    dataKey="score"
                    position="right"
                    style={{ fontFamily: 'Poppins, sans-serif', fontSize: '13px', fill: '#0A0A0A', fontWeight: 700 }}
                  />
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
          <div className="flex flex-wrap gap-x-5 gap-y-2 mt-5 text-xs text-[var(--ink-soft)] justify-center font-medium">
            <span className="inline-flex items-center gap-1.5">
              <span className="w-3.5 h-3.5 rounded bg-[var(--bayside-blue)]" /> Top 3 (Primary)
            </span>
            <span className="inline-flex items-center gap-1.5">
              <span className="w-3.5 h-3.5 rounded bg-[var(--bayside-cyan)]" /> Secondary (10–14)
            </span>
            <span className="inline-flex items-center gap-1.5">
              <span className="w-3.5 h-3.5 rounded bg-[#CBD5E1]" /> Below 10
            </span>
          </div>
        </div>

        {/* Secondary */}
        {secondary.length > 0 && (
          <div className="mb-12">
            <h2 className="font-display text-2xl sm:text-3xl uppercase-tight mb-1">
              SECONDARY <span className="text-[var(--bayside-cyan)]">GIFTS</span>
            </h2>
            <p className="text-sm text-[var(--ink-muted)] mb-5">Worth exploring — these may emerge as God grows you.</p>
            <div className="grid sm:grid-cols-2 gap-3">
              {secondary.map((g) => (
                <div key={g.id} className="bs-card p-4">
                  <div className="flex items-baseline justify-between mb-1.5">
                    <h3 className="font-bold uppercase-tight">{g.name}</h3>
                    <span className="font-display text-xl text-[var(--bayside-blue)] tabular-nums">
                      {g.score}<span className="text-xs text-[var(--ink-muted)] font-normal">/20</span>
                    </span>
                  </div>
                  <p className="text-xs text-[var(--ink-soft)] leading-relaxed">{g.desc}</p>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Calling Profile recap */}
        <div className="mb-12 page-break">
          <h2 className="font-display text-2xl sm:text-3xl uppercase-tight mb-1">
            YOUR CALLING <span className="text-[var(--bayside-blue)]">PROFILE</span>
          </h2>
          <p className="text-sm text-[var(--ink-muted)] mb-6">
            Where your gifts and these reflections overlap is often where God is calling you to serve.
          </p>
          <div className="space-y-3">
            {CALLING_QUESTIONS.map((q) => {
              const answer = callingAnswers[q.key];
              const Icon = q.icon;
              return (
                <div key={q.key} className="bs-card p-5">
                  <div className="flex items-center gap-2.5 mb-2">
                    <Icon className="w-4 h-4 text-[var(--bayside-blue)]" />
                    <h3 className="font-bold uppercase-tight">{q.title}</h3>
                  </div>
                  <p className="text-[var(--ink)] leading-relaxed whitespace-pre-wrap">
                    {answer ? answer : <span className="italic text-[var(--ink-muted)]">No response — consider returning to add your reflection.</span>}
                  </p>
                </div>
              );
            })}
          </div>
        </div>

        {/* Closing dark CTA section */}
        <div className="bs-card-dark p-8 sm:p-10 mb-10 text-center relative overflow-hidden">
          <div
            className="absolute -top-12 -right-12 w-40 h-40 rounded-full opacity-25"
            style={{ background: 'radial-gradient(circle, var(--bayside-cyan), transparent 70%)' }}
          />
          <div
            className="absolute -bottom-16 -left-12 w-48 h-48 rounded-full opacity-20"
            style={{ background: 'radial-gradient(circle, var(--bayside-blue), transparent 70%)' }}
          />
          <div className="relative">
            <div className="uppercase-wide text-[11px] text-[var(--bayside-cyan)] font-semibold mb-3">
              Your Next Step
            </div>
            <h3 className="font-display text-3xl sm:text-5xl leading-[0.95] mb-5">
              DON’T BURY<br/>WHAT GOD HAS<br/>
              <span className="text-[var(--bayside-cyan)]">ENTRUSTED</span> TO YOU.
            </h3>
            <p className="font-serif italic text-lg sm:text-xl text-white/85 leading-relaxed max-w-xl mx-auto mb-3">
              “For we are his workmanship, created in Christ Jesus for good works, which God prepared
              beforehand, that we should walk in them.”
            </p>
            <div className="uppercase-wide text-[10px] text-[var(--bayside-cyan)] font-semibold mb-6">
              — Ephesians 2:10
            </div>
            <p className="text-sm text-white/70 max-w-md mx-auto">
              Talk to a pastor, mentor, or trusted friend about what you’ve discovered. Take one
              specific step in the next 30 days to begin using your gifts.
            </p>
          </div>
        </div>

        {/* Actions */}
        <div className="no-print">
          <div className="flex flex-wrap gap-3 justify-center mb-8">
            <button onClick={() => window.print()} className="bs-btn-primary inline-flex items-center gap-2 px-5 py-3 rounded-lg text-sm">
              <Printer className="w-4 h-4" /> Print / Save PDF
            </button>
            <button onClick={downloadResults} className="bs-btn-secondary inline-flex items-center gap-2 px-5 py-3 rounded-lg text-sm">
              <Download className="w-4 h-4" /> Download as Text
            </button>
            <button onClick={emailResults} className="bs-btn-secondary inline-flex items-center gap-2 px-5 py-3 rounded-lg text-sm">
              <Mail className="w-4 h-4" /> Email My Pastor
            </button>
          </div>

          <div className="flex flex-wrap gap-2 justify-center text-sm text-[var(--ink-muted)] font-medium">
            <button onClick={onEditInventory} className="hover:text-[var(--bayside-blue)] underline-offset-4 hover:underline uppercase-tight text-xs">
              Edit Inventory
            </button>
            <span>·</span>
            <button onClick={onEditCalling} className="hover:text-[var(--bayside-blue)] underline-offset-4 hover:underline uppercase-tight text-xs">
              Edit Calling Profile
            </button>
            <span>·</span>
            <button onClick={onRestart} className="hover:text-[var(--bayside-blue)] underline-offset-4 hover:underline uppercase-tight text-xs">
              Start Over
            </button>
          </div>

          <div className="flex items-center justify-center gap-2 mt-10 pt-8 border-t border-[var(--line)]">
            <BaysideMark size={20} />
            <span className="uppercase-wide text-[10px] font-semibold text-[var(--ink-muted)]">
              baysidechapel.org
            </span>
          </div>
        </div>
      </div>
    </div>
  );
}

function TopGiftCard({ gift, rank, delay }) {
  const isPrimary = rank === 0;
  const accent =
    rank === 0 ? 'var(--bayside-blue)' :
    rank === 1 ? 'var(--bayside-cyan)' :
    'var(--bayside-magenta)';
  const labels = ['Primary', 'Second', 'Third'];

  return (
    <div
      className={`relative rounded-[14px] overflow-hidden bs-stamp ${isPrimary ? 'bs-card-dark' : 'bs-card'}`}
      style={{ animationDelay: `${delay}ms` }}
    >
      {/* Rank badge */}
      <div
        className="absolute top-0 right-0 w-16 h-16 flex items-start justify-end pt-3 pr-3"
        style={{ background: `linear-gradient(225deg, ${accent} 0%, transparent 60%)`, opacity: isPrimary ? 0.7 : 0.3 }}
      >
        <span className={`font-display text-3xl ${isPrimary ? 'text-white' : ''}`} style={!isPrimary ? { color: accent } : {}}>
          0{rank + 1}
        </span>
      </div>

      <div className="p-5 sm:p-6 relative">
        <div className={`uppercase-wide text-[10px] font-semibold mb-1 ${isPrimary ? 'text-[var(--bayside-cyan)]' : ''}`} style={!isPrimary ? { color: accent } : {}}>
          {labels[rank]} Gift
        </div>
        <h3 className={`font-display text-2xl sm:text-3xl uppercase-tight leading-tight mb-3 ${isPrimary ? 'text-white' : ''}`}>
          {gift.name}
        </h3>
        <div className={`flex items-baseline gap-1 mb-4 ${isPrimary ? 'text-white' : ''}`}>
          <span className="font-display text-4xl tabular-nums leading-none" style={{ color: isPrimary ? '#fff' : accent }}>
            {gift.score}
          </span>
          <span className={`text-sm ${isPrimary ? 'text-white/60' : 'text-[var(--ink-muted)]'}`}>/20</span>
        </div>
        <p className={`text-sm leading-relaxed mb-4 ${isPrimary ? 'text-white/85' : 'text-[var(--ink-soft)]'}`}>
          {gift.desc}
        </p>
        <div className={`pt-3 border-t flex items-start gap-1.5 ${isPrimary ? 'border-white/15' : 'border-[var(--line)]'}`}>
          <BookOpen className={`w-3.5 h-3.5 mt-0.5 shrink-0 ${isPrimary ? 'text-[var(--bayside-cyan)]' : ''}`} style={!isPrimary ? { color: accent } : {}} />
          <span className={`text-xs italic leading-snug ${isPrimary ? 'text-white/70' : 'text-[var(--ink-muted)]'}`}>
            {gift.scripture}
          </span>
        </div>
      </div>
    </div>
  );
}

const rootEl = document.getElementById('root');
const root = createRoot(rootEl);
root.render(<SpiritualGiftsApp />);

const loader = document.getElementById('initial-loader');
if (loader) {
  setTimeout(() => {
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 500);
  }, 100);
}
</script>
