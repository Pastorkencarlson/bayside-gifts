function AdminApp() {
  const [authState, setAuthState] = useState('checking');
  const [user, setUser] = useState(null);
  const [submissions, setSubmissions] = useState([]);
  const [loading, setLoading] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [selectedSub, setSelectedSub] = useState(null);
  const isConfigured = !SUPABASE_URL.includes('PASTE') && !SUPABASE_ANON_KEY.includes('PASTE');

  useEffect(() => {
    if (!isConfigured) { setAuthState('not-configured'); return; }
    supabase.auth.getSession().then(({ data }) => {
      if (data?.session) { setUser(data.session.user); setAuthState('authed'); }
      else setAuthState('login');
    }).catch(() => setAuthState('login'));
    const { data: listener } = supabase.auth.onAuthStateChange((_event, session) => {
      if (session) { setUser(session.user); setAuthState('authed'); }
      else { setUser(null); setAuthState('login'); }
    });
    return () => listener?.subscription?.unsubscribe?.();
  }, []);

  async function loadSubmissions() {
    setLoading(true); setLoadError(null);
    const { data, error } = await supabase
      .from('assessments')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) setLoadError(error.message);
    else setSubmissions(data || []);
    setLoading(false);
  }

  useEffect(() => {
    if (authState === 'authed') loadSubmissions();
  }, [authState]);

  async function handleLogout() {
    await supabase.auth.signOut();
    setUser(null);
    setSubmissions([]);
    setAuthState('login');
  }

  if (authState === 'checking') return <CenteredLoader text="Loading…" />;
  if (authState === 'not-configured') return <NotConfiguredScreen />;
  if (authState === 'login') return <LoginScreen />;

  if (selectedSub) {
    return <DetailScreen submission={selectedSub} onBack={() => setSelectedSub(null)} />;
  }

  return (
    <DashboardScreen
      submissions={submissions}
      loading={loading}
      loadError={loadError}
      user={user}
      onSelect={setSelectedSub}
      onLogout={handleLogout}
      onReload={loadSubmissions}
    />
  );
}

function DashboardScreen({ submissions, loading, loadError, user, onSelect, onLogout, onReload }) {
  const [searchQuery, setSearchQuery] = useState('');
  const [sortBy, setSortBy] = useState('newest');

  const stats = useMemo(() => {
    const total = submissions.length;
    const now = Date.now();
    const weekAgo = now - 7 * 24 * 60 * 60 * 1000;
    const monthAgo = now - 30 * 24 * 60 * 60 * 1000;
    const thisWeek = submissions.filter(s => new Date(s.created_at).getTime() > weekAgo).length;
    const thisMonth = submissions.filter(s => new Date(s.created_at).getTime() > monthAgo).length;

    const giftTotals = {};
    GIFTS.forEach(g => giftTotals[g.id] = 0);
    submissions.forEach(s => {
      const scores = s.scores || {};
      Object.entries(scores).forEach(([id, score]) => {
        if (giftTotals[id] !== undefined) giftTotals[id] += Number(score) || 0;
      });
    });
    const avgScores = GIFTS.map(g => ({
      name: g.name,
      avgScore: total > 0 ? Math.round((giftTotals[g.id] / total) * 10) / 10 : 0,
    })).sort((a, b) => b.avgScore - a.avgScore);

    return { total, thisWeek, thisMonth, avgScores };
  }, [submissions]);

  const filteredSubmissions = useMemo(() => {
    let list = [...submissions];
    if (searchQuery.trim()) {
      const q = searchQuery.toLowerCase().trim();
      list = list.filter(s =>
        (s.name || '').toLowerCase().includes(q) ||
        (s.email || '').toLowerCase().includes(q)
      );
    }
    if (sortBy === 'newest') list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    else if (sortBy === 'oldest') list.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    else if (sortBy === 'name') list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    return list;
  }, [submissions, searchQuery, sortBy]);

  function exportCSV() {
    const rows = [['Date', 'Name', 'Email', 'Top 1', 'Top 1 Score', 'Top 2', 'Top 2 Score', 'Top 3', 'Top 3 Score', 'All Scores']];
    submissions.forEach(s => {
      const t = s.top_three || [];
      const allScores = Object.entries(s.scores || {})
        .map(([id, score]) => `${(GIFT_BY_ID[id] || {}).name || id}:${score}`)
        .join('; ');
      rows.push([
        new Date(s.created_at).toLocaleString(),
        s.name || '',
        s.email || '',
        t[0]?.name || '', t[0]?.score ?? '',
        t[1]?.name || '', t[1]?.score ?? '',
        t[2]?.name || '', t[2]?.score ?? '',
        allScores,
      ]);
    });
    const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `bayside-assessments-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  return (
    <div className="min-h-screen">
      <div className="bg-[#0A0A0A] text-white px-5 sm:px-8 py-5" style={{ backgroundImage: 'radial-gradient(ellipse at 50% 0%, rgba(72,216,219,0.10) 0%, transparent 60%)' }}>
        <div className="max-w-6xl mx-auto flex items-center justify-between gap-3">
          <BrandHeader dark />
          <div className="flex items-center gap-3">
            <span className="text-xs text-white/60 hidden sm:inline truncate max-w-[180px]">{user?.email}</span>
            <button
              onClick={onLogout}
              className="inline-flex items-center gap-1.5 px-3 py-2 text-xs uppercase tracking-[0.05em] font-semibold text-white/80 hover:text-white border border-white/20 hover:border-white/40 rounded-md transition"
            >
              <LogOut className="w-3.5 h-3.5" /> Sign Out
            </button>
          </div>
        </div>
      </div>

      <div className="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
        <div className="grid grid-cols-3 gap-3 sm:gap-4 mb-8">
          <StatCard label="Total Submissions" value={stats.total} icon={Users} color="#0270DE" />
          <StatCard label="Past 7 Days" value={stats.thisWeek} icon={Calendar} color="#48D8DB" />
          <StatCard label="Past 30 Days" value={stats.thisMonth} icon={TrendingUp} color="#BA3175" />
        </div>

        {submissions.length > 0 && (
          <div className="bg-white rounded-2xl p-5 sm:p-7 mb-8 shadow-sm">
            <div className="flex items-end justify-between flex-wrap gap-2 mb-1">
              <h2 className="font-black text-2xl tracking-tight uppercase">
                BAYSIDE’S <span className="text-[#0270DE]">PROFILE</span>
              </h2>
              <div className="text-xs uppercase tracking-[0.18em] text-[#6B7280] font-semibold">
                Avg Score · {stats.total} people
              </div>
            </div>
            <p className="text-sm text-[#6B7280] mb-5">Average score per gift across all submissions. Higher = more common in your congregation.</p>
            <div style={{ height: Math.max(420, GIFTS.length * 26) }}>
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={stats.avgScores} layout="vertical" margin={{ top: 5, right: 40, left: 0, bottom: 5 }}>
                  <XAxis type="number" domain={[0, 20]} ticks={[0, 5, 10, 15, 20]} axisLine={false} tickLine={false} tick={{ fontSize: 11, fill: '#6B7280' }} />
                  <YAxis type="category" dataKey="name" width={130} axisLine={false} tickLine={false} tick={{ fontSize: 12, fill: '#0A0A0A' }} />
                  <Tooltip
                    contentStyle={{ backgroundColor: '#0A0A0A', border: 'none', borderRadius: '8px', fontSize: '13px', color: '#fff' }}
                    labelStyle={{ color: '#48D8DB', fontWeight: 700, textTransform: 'uppercase', fontSize: '11px', letterSpacing: '0.05em' }}
                    itemStyle={{ color: '#fff' }}
                    formatter={(v) => [`${v} avg`, 'Score']}
                    cursor={{ fill: 'rgba(2,112,222,0.08)' }}
                  />
                  <Bar dataKey="avgScore" radius={[0, 6, 6, 0]}>
                    {stats.avgScores.map((entry, idx) => (
                      <Cell key={idx} fill={idx < 3 ? '#0270DE' : idx < 8 ? '#48D8DB' : '#CBD5E1'} />
                    ))}
                    <LabelList dataKey="avgScore" position="right" style={{ fontFamily: 'Poppins, sans-serif', fontSize: '12px', fill: '#0A0A0A', fontWeight: 700 }} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>
        )}

        <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
          <h2 className="font-black text-2xl tracking-tight uppercase">Submissions</h2>
          <div className="flex items-center gap-2">
            <button
              onClick={onReload}
              className="inline-flex items-center gap-1.5 px-3 py-2 text-xs uppercase tracking-[0.05em] font-semibold text-[#0A0A0A] border border-[#E5E7EB] hover:border-[#0A0A0A] rounded-md"
              disabled={loading}
            >
              <RefreshCw className={`w-3.5 h-3.5 ${loading ? 'animate-spin' : ''}`} /> Refresh
            </button>
            <button
              onClick={exportCSV}
              disabled={submissions.length === 0}
              className="inline-flex items-center gap-1.5 px-3 py-2 text-xs uppercase tracking-[0.05em] font-semibold text-white bg-[#0270DE] hover:bg-[#0058B0] rounded-md disabled:opacity-40"
            >
              <Download className="w-3.5 h-3.5" /> Export CSV
            </button>
          </div>
        </div>

        <div className="flex items-center gap-2 mb-4">
          <div className="relative flex-1">
            <Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-[#6B7280]" />
            <input
              type="text"
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
              placeholder="Search by name or email…"
              className="w-full pl-10 pr-4 py-2.5 bg-white border border-[#E5E7EB] rounded-lg focus:outline-none focus:border-[#0270DE] focus:ring-4 focus:ring-[#0270DE]/12 text-sm"
            />
          </div>
          <select
            value={sortBy}
            onChange={e => setSortBy(e.target.value)}
            className="px-3 py-2.5 bg-white border border-[#E5E7EB] rounded-lg focus:outline-none focus:border-[#0270DE] focus:ring-4 focus:ring-[#0270DE]/12 text-sm font-medium"
          >
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="name">Name (A–Z)</option>
          </select>
        </div>

        {loadError && (
          <div className="mb-5 px-4 py-3 bg-[#F1592A]/10 border border-[#F1592A]/30 rounded-lg flex items-start gap-2">
            <AlertCircle className="w-4 h-4 text-[#F1592A] shrink-0 mt-0.5" />
            <span className="text-sm">{loadError}</span>
          </div>
        )}

        {loading && submissions.length === 0 && <CenteredLoader text="Loading submissions…" />}

        {!loading && filteredSubmissions.length === 0 && submissions.length === 0 && (
          <div className="bg-white rounded-2xl p-12 text-center">
            <div className="w-14 h-14 rounded-full bg-[#0270DE]/10 flex items-center justify-center mx-auto mb-4">
              <Users className="w-6 h-6 text-[#0270DE]" />
            </div>
            <h3 className="font-bold text-lg mb-2">No submissions yet</h3>
            <p className="text-sm text-[#6B7280]">Once people complete the assessment, their results will appear here.</p>
          </div>
        )}

        {!loading && filteredSubmissions.length === 0 && submissions.length > 0 && (
          <div className="bg-white rounded-2xl p-10 text-center">
            <p className="text-sm text-[#6B7280]">No submissions match “{searchQuery}”.</p>
          </div>
        )}

        <div className="space-y-2">
          {filteredSubmissions.map(sub => (
            <SubmissionRow key={sub.id} sub={sub} onClick={() => onSelect(sub)} />
          ))}
        </div>

        <p className="text-xs text-[#6B7280] text-center mt-10">
          Showing {filteredSubmissions.length} of {submissions.length} submissions ·
          <span className="ml-1">Bayside Chapel · baysidechapel.org</span>
        </p>
      </div>
    </div>
  );
}

function StatCard({ label, value, icon: Icon, color }) {
  return (
    <div className="bg-white rounded-2xl p-4 sm:p-5 shadow-sm relative overflow-hidden">
      <div className="absolute -top-4 -right-4 w-16 h-16 rounded-full opacity-15" style={{ background: `radial-gradient(circle, ${color}, transparent 60%)` }} />
      <Icon className="w-4 h-4 mb-2" style={{ color }} />
      <div className="font-black text-3xl sm:text-4xl tabular-nums leading-none mb-1" style={{ color }}>{value}</div>
      <div className="text-[10px] sm:text-xs uppercase tracking-[0.12em] font-semibold text-[#6B7280] leading-tight">{label}</div>
    </div>
  );
}

function SubmissionRow({ sub, onClick }) {
  const top = (sub.top_three || [])[0];
  return (
    <button
      onClick={onClick}
      className="w-full text-left bg-white rounded-xl p-4 hover:shadow-md hover:bg-[#0270DE]/[0.02] transition border-l-[3px] border-transparent hover:border-[#0270DE]"
    >
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="min-w-0 flex-1">
          <div className="font-bold text-[#0A0A0A] truncate">{sub.name || '—'}</div>
          <div className="text-xs text-[#6B7280] truncate flex items-center gap-1.5">
            <Mail className="w-3 h-3 shrink-0" /> {sub.email || '—'}
          </div>
        </div>
        <div className="text-right shrink-0">
          {top && (
            <div className="inline-flex items-center gap-1.5 mb-1">
              <Award className="w-3.5 h-3.5 text-[#0270DE]" />
              <span className="font-bold text-sm">{top.name}</span>
              <span className="text-xs text-[#6B7280] tabular-nums">({top.score}/20)</span>
            </div>
          )}
          <div className="text-xs text-[#6B7280] tabular-nums">
            {new Date(sub.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}
          </div>
        </div>
        <ChevronRight className="w-4 h-4 text-[#6B7280] shrink-0" />
      </div>
    </button>
  );
}

/* ===================================================================== */
/*                          DETAIL VIEW                                  */
/* ===================================================================== */

function DetailScreen({ submission, onBack }) {
  const sub = submission;
  const scoresMap = sub.scores || {};
  const allScores = GIFTS.map(g => ({ ...g, score: Number(scoresMap[g.id]) || 0 }));
  const sortedScores = [...allScores].sort((a, b) => b.score - a.score);
  const topThree = sortedScores.slice(0, 3);

  const chartData = sortedScores.map((s, idx) => ({
    name: s.name,
    score: s.score,
    tier: idx < 3 ? 'top' : s.score >= 10 ? 'secondary' : 'low',
  }));
  const tierColor = (t) => t === 'top' ? '#0270DE' : t === 'secondary' ? '#48D8DB' : '#CBD5E1';

  const callingAnswers = sub.calling_answers || {};

  return (
    <div className="min-h-screen">
      <div className="bg-[#0A0A0A] text-white px-5 sm:px-8 py-5 sticky top-0 z-30">
        <div className="max-w-4xl mx-auto flex items-center justify-between gap-3">
          <button
            onClick={onBack}
            className="inline-flex items-center gap-1.5 text-xs uppercase tracking-[0.05em] font-semibold text-white/80 hover:text-white"
          >
            <ChevronLeft className="w-4 h-4" /> All Submissions
          </button>
          <div className="text-xs text-white/60 truncate">
            {new Date(sub.created_at).toLocaleString()}
          </div>
        </div>
      </div>

      <div className="max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
        <div className="mb-8">
          <div className="uppercase tracking-[0.18em] text-[11px] text-[#0270DE] font-semibold mb-3">Member</div>
          <h1 className="font-black text-4xl sm:text-5xl tracking-tight uppercase leading-[0.95] mb-2">
            {sub.name}
          </h1>
          <a href={`mailto:${sub.email}`} className="inline-flex items-center gap-1.5 text-[#0270DE] hover:underline text-sm">
            <Mail className="w-4 h-4" /> {sub.email}
          </a>
        </div>

        <div className="grid sm:grid-cols-3 gap-3 mb-10">
          {topThree.map((g, i) => (
            <div key={g.id} className={`rounded-xl p-5 ${i === 0 ? 'bg-[#0A0A0A] text-white' : 'bg-white'} shadow-sm relative overflow-hidden`}>
              <div className={`text-[10px] uppercase tracking-[0.18em] font-semibold mb-1 ${i === 0 ? 'text-[#48D8DB]' : i === 1 ? 'text-[#48D8DB]' : 'text-[#BA3175]'}`}>
                {i === 0 ? 'Primary' : i === 1 ? 'Second' : 'Third'}
              </div>
              <div className="font-black text-xl tracking-tight uppercase leading-tight mb-2">{g.name}</div>
              <div className="font-black text-3xl tabular-nums leading-none mb-3" style={{ color: i === 0 ? '#fff' : i === 1 ? '#48D8DB' : '#BA3175' }}>
                {g.score}<span className={`text-xs font-normal ${i === 0 ? 'text-white/60' : 'text-[#6B7280]'}`}>/20</span>
              </div>
              <p className={`text-xs leading-relaxed ${i === 0 ? 'text-white/80' : 'text-[#3A3A3A]'}`}>
                {g.desc}
              </p>
              <div className={`pt-2 mt-3 border-t flex items-start gap-1.5 ${i === 0 ? 'border-white/15' : 'border-[#E5E7EB]'}`}>
                <BookOpen className={`w-3 h-3 mt-0.5 shrink-0 ${i === 0 ? 'text-[#48D8DB]' : ''}`} style={i !== 0 ? { color: i === 1 ? '#48D8DB' : '#BA3175' } : {}} />
                <span className={`text-[10px] italic ${i === 0 ? 'text-white/70' : 'text-[#6B7280]'}`}>{g.scripture}</span>
              </div>
            </div>
          ))}
        </div>

        <div className="bg-white rounded-2xl p-5 sm:p-6 mb-10 shadow-sm">
          <h2 className="font-black text-xl uppercase tracking-tight mb-1">Complete Profile</h2>
          <p className="text-xs text-[#6B7280] mb-5">All 18 gifts, ranked.</p>
          <div style={{ height: Math.max(420, GIFTS.length * 26) }}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={chartData} layout="vertical" margin={{ top: 5, right: 40, left: 0, bottom: 5 }}>
                <XAxis type="number" domain={[0, 20]} ticks={[0, 5, 10, 15, 20]} axisLine={false} tickLine={false} tick={{ fontSize: 11, fill: '#6B7280' }} />
                <YAxis type="category" dataKey="name" width={130} axisLine={false} tickLine={false} tick={{ fontSize: 12, fill: '#0A0A0A' }} />
                <Tooltip contentStyle={{ backgroundColor: '#0A0A0A', border: 'none', borderRadius: '8px', fontSize: '13px', color: '#fff' }} labelStyle={{ color: '#48D8DB', fontWeight: 700, textTransform: 'uppercase', fontSize: '11px', letterSpacing: '0.05em' }} itemStyle={{ color: '#fff' }} formatter={(v) => [`${v}/20`, 'Score']} cursor={{ fill: 'rgba(2,112,222,0.08)' }} />
                <Bar dataKey="score" radius={[0, 6, 6, 0]}>
                  {chartData.map((entry, idx) => <Cell key={idx} fill={tierColor(entry.tier)} />)}
                  <LabelList dataKey="score" position="right" style={{ fontFamily: 'Poppins, sans-serif', fontSize: '12px', fill: '#0A0A0A', fontWeight: 700 }} />
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>

        <h2 className="font-black text-xl uppercase tracking-tight mb-1">Calling Profile</h2>
        <p className="text-xs text-[#6B7280] mb-5">In their own words.</p>
        <div className="space-y-3">
          {CALLING_QUESTIONS.map(q => {
            const Icon = q.icon;
            const answer = callingAnswers[q.key];
            return (
              <div key={q.key} className="bg-white rounded-xl p-5 shadow-sm">
                <div className="flex items-center gap-2 mb-2">
                  <Icon className="w-4 h-4 text-[#0270DE]" />
                  <h3 className="font-bold uppercase tracking-[0.05em] text-sm">{q.title}</h3>
                </div>
                <p className="text-[#0A0A0A] leading-relaxed whitespace-pre-wrap">
                  {answer ? answer : <span className="italic text-[#6B7280]">No response.</span>}
                </p>
              </div>
            );
          })}
        </div>

        <div className="flex flex-wrap justify-center gap-3 mt-10">
          <a
            href={`mailto:${sub.email}?subject=${encodeURIComponent('Your Spiritual Gifts Assessment')}&body=${encodeURIComponent(`Hi ${(sub.name || '').split(' ')[0]},\n\nI saw your assessment results and would love to talk about how you can use your gifts in `+(topThree[0]?.name || '')+`.\n\n— Bayside Chapel`)}`}
            className="inline-flex items-center gap-2 px-5 py-3 bg-[#0270DE] text-white font-bold uppercase tracking-[0.05em] text-sm rounded-lg hover:bg-[#0058B0]"
          >
            <Mail className="w-4 h-4" /> Email {(sub.name || '').split(' ')[0] || 'them'}
          </a>
        </div>
      </div>
    </div>
  );
}

/* ===================================================================== */
/*                              MOUNT                                    */
/* ===================================================================== */

const rootEl = document.getElementById('root');
const root = createRoot(rootEl);
root.render(<AdminApp />);

const loader = document.getElementById('initial-loader');
if (loader) {
  setTimeout(() => {
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 500);
  }, 100);
}
</script>
</body>
</html>
